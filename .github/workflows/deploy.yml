name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browser tests run against the local Firebase emulator, which needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx ng test --watch=false
      - run: npx ng build
      # Browser tests against the build (color picker and more); a failure stops the deploy.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/order-queue/browser

  deploy:
    needs: build
    # Only main goes live; a run on another branch just builds and tests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The Android app (Capacitor): the same build in a native shell, after the tests passed.
  # The APK is attached to the "android-latest" release, to download straight to a phone.
  android:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk pizza-queue.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pizza-queue-android
          path: pizza-queue.apk
      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest \
            --prerelease --title "Android app (latest)" \
            --notes "The latest Pizza queue Android app, built from main. Open this page on the phone and tap pizza-queue.apk to install."
          gh release upload android-latest pizza-queue.apk --clobber
